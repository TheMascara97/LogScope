<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>LogScope</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workstation.css"><link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="windterm.css"><link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css"></head><body>
<header><b>◉ LOGSCOPE</b><span id="subtitle">设备日志工作台</span><button id="newSession">＋ 新建会话</button><button id="save">自动保存位置</button><button id="importLog">导入日志</button><button id="rules">过滤规则</button><button id="bookmark">书签</button><button id="context">异常上下文</button><button id="stats">统计</button><button id="report">导出报告</button><button id="ai">智能分析</button><select id="language" title="Language"><option value="zh">中文</option><option value="en">English</option></select></header>
<main><aside><div class="side-title" data-i18n="sessions">会话</div><div id="sessions"></div><hr><div class="side-title" data-i18n="saved">已保存会话（双击重连）</div><div id="savedSessions" class="saved"></div><hr><div class="side-title" data-i18n="analysisSettings">分析设置</div><label><input id="cloud" type="checkbox"> <span data-i18n="cloud">启用云端 AI</span></label><label><input id="outbound" type="checkbox"> <span data-i18n="outbound">允许脱敏后出网</span></label><input id="model" value="gpt-5" placeholder="AI model"><p class="small" data-i18n="localHint">未启用云端时，仅使用本地规则分析。</p></aside>
<section><div class="tabs" id="tabs"></div><div class="filter"><input id="query" placeholder="搜索 / 正则过滤当前窗口"><span id="status">正在连接采集核心…</span></div><pre id="terminal" tabindex="0"><span class="muted">新建一个会话以开始采集日志。</span></pre><div id="quickCommands" class="quick"></div><div class="send"><input id="command" placeholder="定时发送的命令：先填这里，再设间隔和次数；Enter 不会发送"><button id="schedule" type="button">定时发送</button><button id="quickManage" type="button">快捷命令</button><button id="close">断开</button></div><div id="timerPanel" class="timer hidden"><label>间隔（秒）<input id="interval" type="number" min="1" value="5"></label><button id="timerToggle">开始定时</button><span id="timerState"></span></div></section>
<aside class="analysis"><div class="side-title">ANALYSIS</div><div id="findings" class="muted">等待异常日志…</div></aside></main>
<dialog id="sessionDialog"><form method="dialog"><div class="dialog-head"><strong data-i18n="newSession">新建会话</strong><button value="cancel" aria-label="Close">×</button></div><div class="protocols"><button type="button" class="proto active" data-type="ssh">SSH</button><button type="button" class="proto" data-type="telnet">Telnet</button><button type="button" class="proto" data-type="tcp">TCP</button><button type="button" class="proto" data-type="serial">Serial</button><button type="button" class="proto" data-type="cmd">CMD</button><button type="button" class="proto" data-type="adb">ADB</button></div><div class="fields"><label><span data-i18n="label">标签</span><input id="sLabel" placeholder="测试台 01"></label><label class="network"><span data-i18n="host">主机</span><input id="sHost" placeholder="192.168.1.10"></label><label class="network"><span data-i18n="port">端口</span><input id="sPort" type="number" value="22"></label><label class="ssh-only"><span data-i18n="user">用户</span><input id="sUser" placeholder="root"></label><label class="ssh-only"><span data-i18n="sshKey">SSH Key</span><input id="sKey" data-i18n-placeholder="sshKeyHint" placeholder="私钥文件路径（可选）"></label><label class="ssh-only"><span data-i18n="command">远程命令</span><input id="sCommand" value="tail -F /var/log/syslog"></label><label class="serial-only hidden"><span data-i18n="serialPort">串口</span><select id="sSerial"><option value="">扫描中…</option></select><button id="scanSerial" type="button" data-i18n="scan">扫描</button></label><label class="serial-only hidden"><span data-i18n="baud">波特率</span><select id="sBaud"><option>115200</option><option>9600</option><option>57600</option><option>230400</option></select></label><label class="serial-only hidden"><span data-i18n="dataBits">数据位</span><select id="sDataBits"><option value="8">8</option><option value="7">7</option><option value="6">6</option><option value="5">5</option></select></label><label class="serial-only hidden"><span data-i18n="stopBits">停止位</span><select id="sStopBits"><option value="1">1</option><option value="2">2</option></select></label><label class="serial-only hidden"><span data-i18n="parity">校验</span><select id="sParity"><option value="none">None</option><option value="even">Even</option><option value="odd">Odd</option></select></label><label class="serial-only hidden"><span data-i18n="flow">流控</span><select id="sFlow"><option value="none">None</option><option value="hardware">Hardware</option><option value="software">Software</option></select></label><label class="adb-only hidden"><span data-i18n="adbSerial">ADB serial</span><input id="sAdbSerial" placeholder="可选；留空使用默认设备"></label><label class="cmd-adb-only hidden"><span data-i18n="command">命令</span><input id="sLocalCommand" data-i18n-placeholder="localCommandHint" placeholder="CMD 留空启动命令行；ADB 默认 logcat"></label><label><span data-i18n="description">描述</span><textarea id="sDescription" placeholder="可选备注"></textarea></label></div><div class="dialog-actions"><button value="cancel" data-i18n="cancel">取消</button><button id="connect" value="default" class="primary" data-i18n="connect">连接</button></div></form></dialog>
<dialog id="quickDialog"><form method="dialog"><div class="dialog-head"><strong>快捷命令</strong><button value="cancel">×</button></div><div id="quickRows"></div><button type="button" id="quickAdd">＋ 添加命令</button><div class="dialog-actions"><button value="cancel">取消</button><button id="quickSave" value="default" class="primary">保存</button></div></form></dialog><script src="analysis.js"></script><script src="log-cache.js"></script><script src="kb-vector.js"></script><script src="renderer.js"></script><script src="automation.js"></script><script src="session-encoding.js"></script><script src="workbench.js"></script><script src="terminal-tools.js"></script><script src="node_modules/@xterm/xterm/lib/xterm.js"></script><script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script><script src="node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script><script src="node_modules/@xterm/addon-search/lib/addon-search.js"></script><script src="node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script><script src="node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script><script src="terminal-options.js"></script><script src="terminal-view.js"></script><script src="interface.js"></script><script src="log-navigation.js"></script><script src="log-virtual.js"></script><script src="search-options.js"></script><script src="workspace-controls.js"></script><script src="config-controls.js"></script><script src="workstation.js"></script><script src="source-extensions.js"></script><script src="serial-metadata.js"></script><script src="command-template.js"></script><script src="command-tools.js"></script><script src="file-transfer.js"></script><script src="frame-analysis.js"></script><script src="frame-tools.js"></script><script src="transfer-tools.js"></script><script src="appearance.js"></script><script src="terminal-options-panel.js"></script><script src="settings.js"></script><script src="navigation-tools.js"></script><script src="replay-clock.js"></script><script src="replay-tools.js"></script><script src="local-model-tools.js"></script><script src="ai-provider-tools.js"></script><script src="regex-runner.js"></script><script src="rule-pipeline.js"></script><script src="output-enhancements.js"></script><script src="log-selection.js"></script><script src="log-find.js"></script><script src="hit-list.js"></script><script src="rule-editor.js"></script><script src="telemetry.js"></script><script src="drop-indicator.js"></script><script src="multipane.js"></script><script src="evidence-links.js"></script><script src="parser-editor.js"></script><script src="sftp-panel.js"></script><script src="diagnostic-locale.js"></script><script src="ui-actions.js"></script><script src="send-box.js"></script><script src="schedule-send.js"></script><script src="log-composer.js"></script><script src="command-completion.js"></script><script src="ui-density.js"></script><script src="analysis-report.js"></script></body></html>
